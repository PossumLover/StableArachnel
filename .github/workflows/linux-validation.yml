name: Linux validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build git-lfs pkg-config libboost-dev libtorrent-rasterbar-dev \
            libgl1 libglib2.0-0 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libpulse0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          modules: qtshadertools qtmultimedia
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Build and run regression tests
        run: |
          cmake -S tests -B build-network-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build-network-tests --parallel 2
          ctest --test-dir build-network-tests --output-on-failure

      - name: Build Linux launcher
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DARACHNEL_FAST_BUILD=OFF
          cmake --build build-linux --target arachnel_app torrent_shutdown_tests --parallel 2
          ./build-linux/torrent_shutdown_tests -o -,txt

      - name: Test settings, search, and achievement interactions
        run: |
          cmake -DSPROUT_BUILD_DIR="$PWD/build-linux" \
            -DQT_BIN_DIR="$QT_ROOT_DIR/bin" -P tests/run-qml-tests.cmake
